server.port=443
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

# HTTPS：使用 /root/ssl 下的 Let's Encrypt 证书（auto_renew_emby_cert.sh 自动续期）
server.ssl.enabled=true
server.ssl.certificate=file:/root/ssl/fullchain.pem
server.ssl.certificate-private-key=file:/root/ssl/privkey.pem

# H2 文件模式数据库（零独立进程，数据落盘）
spring.datasource.url=jdbc:h2:file:/var/lib/adan-blog/blog
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=adan
spring.datasource.password=adan-blog-2026

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 控制台（仅本机调试用，生产可关）
spring.h2.console.enabled=false

# 静态资源缓存：带 hash 的资源长缓存，index.html 不缓存（避免 SPA 更新后用户拿到旧版）
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# 上传限制（封面图 10MB）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 文件存储路径
adan.blog.upload-dir=/var/lib/adan-blog/uploads

# 阿里云 OSS（图片存储）：enabled=true 时上传走 OSS，false 回退本地磁盘
# 密钥从环境变量注入（systemd Environment），不落配置文件/不进 git
adan.blog.oss.enabled=${OSS_ENABLED:false}
adan.blog.oss.endpoint=${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
adan.blog.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
adan.blog.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
adan.blog.oss.bucket=${OSS_BUCKET:adanc}
adan.blog.oss.public-url=${OSS_PUBLIC_URL:https://adanc.oss-cn-beijing.aliyuncs.com}
adan.blog.oss.prefix=images/

# 音乐服务（Emby 音乐库为数据源，aplayer 播放）
adan.blog.emby.base-url=http://adan.ltd:8096
adan.blog.emby.api-key=94b631daeb1d42c5ba390cdf8690ea21
adan.blog.emby.user-id=5ab7562daa88468ab381778ba0bf4fcb
adan.blog.emby.music-lib-id=8607
adan.blog.emby.music-dir=/root/song

# JWT 配置
adan.blog.jwt.secret=adan-blog-jwt-secret-key-2026-please-change-in-production-0123456789
adan.blog.jwt.expire-hours=168

logging.level.root=INFO
logging.level.com.adan.blog=INFO
